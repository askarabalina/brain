[project]
name = "brain-mcp"
version = "0.1.0"
description = "Личная база знаний как MCP-сервер"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26.0,<2.0.0"]

[project.scripts]
brain-mcp = "brain_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mcp"]
